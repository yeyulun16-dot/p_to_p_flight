p_to_p_mission:
  ros__parameters:
    # 坐标系与传感器话题
    map_frame: map
    body_frame: laser_link
    # 飞控/光流高度由 uart_to_stm32_node 从 /dev/ttyS6 的 0x05 帧发布
    height_topic: /height

    # B 点定义方式：
    # relative_body: 相对起飞瞬间机头坐标，X=前、Y=左（推荐）
    # relative_map:  相对地图坐标
    # absolute:      使用 b_x_cm / b_y_cm 的地图绝对坐标
    target_mode: relative_body
    b_offset_x_cm: 50.0
    b_offset_y_cm: 50.0
    b_x_cm: 250.0
    b_y_cm: -250.0

    cruise_height_cm: 60.0
    landing_height_cm: 13.0
    keep_takeoff_yaw: true
    target_yaw_deg: 0.0

    # hold: 到 B 后持续悬停（首次调试推荐）
    # land: 到 B 后等待 pre_descent_hold_sec，再下降到 landing_height_cm；不会自动锁桨
    terminal_behavior: land
    pre_descent_hold_sec: 3.0

    position_tolerance_cm: 12.0
    height_tolerance_cm: 12.0
    yaw_tolerance_deg: 8.0
    reached_stable_sec: 1.0
    sensor_timeout_sec: 0.5
    stop_output_max_height_cm: 25.0
    # 未安装面阵激光，不订阅其下方障碍检测结果
    abort_descent_on_obstacle: false
    route_choice: 3
    update_rate_hz: 10.0

position_pid_controller:
  ros__parameters:
    control_frequency: 50.0
    map_frame: map
    laser_link_frame: laser_link
    kp_xy: 0.8
    ki_xy: 0.0
    kd_xy: 0.2
    kp_yaw: 1.0
    ki_yaw: 0.0
    kd_yaw: 0.2
    kp_z: 1.0
    ki_z: 0.0
    kd_z: 0.2
    max_linear_velocity: 30.0
    max_angular_velocity: 25.0
    max_vertical_velocity: 25.0
    sensor_timeout_sec: 0.5
    visual_kp_x: 0.03
    visual_ki_x: 0.0
    visual_kd_x: 0.003
    visual_kp_y: 0.03
    visual_ki_y: 0.0
    visual_kd_y: 0.003
    visual_pixel_deadzone: 10.0
    visual_max_xy_velocity: 6.0
    visual_data_timeout_sec: 0.5

uart_to_stm32_node:
  ros__parameters:
    update_rate: 100.0
    source_frame: map
    target_frame: laser_link
    serial_port: /dev/ttyS6
    baud_rate: 921600
    # PID 输出是 map 速度；串口桥依据实时 yaw 转成机体系后再发给飞控
    target_velocity_frame: map
    command_timeout_sec: 0.30
